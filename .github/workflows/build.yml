name: AuditChain — Build Web & Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── WEB BUILD ───────────────────────────────────────────────────────────────
  build-web:
    name: Flutter Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        working-directory: auditchain/frontend
        run: flutter pub get

      - name: Build web (release)
        working-directory: auditchain/frontend
        run: |
          flutter build web --release \
            --dart-define=API_URL=/api \
            --web-renderer canvaskit

      - name: Subir artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: auditchain-web
          path: auditchain/frontend/build/web/
          retention-days: 30

  # ── ANDROID BUILD ────────────────────────────────────────────────────────────
  build-android:
    name: Flutter Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        working-directory: auditchain/frontend
        run: flutter pub get

      - name: Build APK debug
        working-directory: auditchain/frontend
        run: |
          flutter build apk --debug \
            --dart-define=API_URL=https://auditchain-backend.railway.app/api

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: auditchain-android-debug
          path: auditchain/frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ── RESUMEN ──────────────────────────────────────────────────────────────────
  summary:
    name: Resumen de artefactos
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    if: always()
    steps:
      - name: Escribir resumen
        run: |
          echo "## AuditChain — Artefactos generados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Plataforma | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web (Flutter Web) | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Android APK (debug) | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Descarga los artefactos desde la pestaña **Actions → Artifacts**" >> $GITHUB_STEP_SUMMARY
