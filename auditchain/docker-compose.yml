services:

  # ── BASE DE DATOS ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: auditchain_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditchain_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── BACKEND ────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: auditchain_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/auditchain_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── FRONTEND FLUTTER WEB ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auditchain_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
